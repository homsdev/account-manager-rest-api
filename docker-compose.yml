version: '3.8'
services:
  db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: account-manager
    ports:
      - "3306:3306"
    networks:
      - app-network

  app:
    build: .
    environment:
      DB.URL: jdbc:mariadb://db:3306/account-manager
      DB.USER: root
      DB.PASS: admin
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      - db

networks:
  app-network: