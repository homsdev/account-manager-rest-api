version: '3.8'#Version of docker composes
services: # containers
  db:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db:/docker-entrypoint-initdb.d
    env_file:
      - .env

volumes:
  postgres-data: