spring:
  application:
    name: account-rest-api
  datasource:
    url: jdbc:mariadb://localhost:3306/account_manager_db
    username: admin
    password: admin
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect